# Metadados de PACOTE — o degrau B1 do `docs/decisions/ROADMAP-proximos-passos.md`.
#
# Por que existe: até aqui instalar era `git clone` + venv, e isso travava as duas
# pontas do MESMO problema — "rodar fora do Claude Code" (B1) e o onboarding (B2,
# fricção 3). Com entry point o servidor vira um comando no PATH, alcançável por
# `pipx`/`uvx`, e some o checkout como pré-requisito. O comparável
# `loyaniu/moodle-mcp` já prova o formato (`[project.scripts] moodle-mcp =
# "moodle_mcp.server:main"`); a diferença de desenho está anotada em
# `[project.scripts]`, mais abaixo.
#
# Isto NÃO substitui o `scripts/servidor.sh` e não pode: o `.mcp.json` versionado
# segue chamando o lançador, que serve o checkout de DESENVOLVIMENTO — onde não há
# instalação nenhuma e o que se quer subir é o código da árvore, não o do site-packages.
# Os dois caminhos convivem, e L1-L6 seguem travando o lançador inteiro.
#
# O `.mcpb` do §6.1 continua NÃO feito, e de propósito: ele responde por instalação
# real no Claude Desktop, não por documentação. Está registrado no
# `docs/decisions/BACKLOG-correcoes.md` como o degrau SEGUINTE a este.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "usp-mcp"

# O MESMO número que os três `MCPServer(version=...)` anunciam no `initialize`.
# Não é cosmético: quem reportar "usp-mcp 0.3.0 quebrou" e receber um handshake
# dizendo 0.1.0 está lendo duas verdades sobre o mesmo processo. P5 lê a `version=`
# de dentro de cada `main()` por AST e reprova se divergirem.
version = "1.1.0"

description = "Ferramentas MCP para a vida acadêmica na USP — bandejão do RUCard, prazos e material do e-Disciplinas, catálogo do JupiterWeb. Projeto não-oficial, sem vínculo com a Universidade de São Paulo."
readme = "README.md"

# Os dois nomes do `LICENSE` e do cabeçalho do README, e não um só: a licença é
# MIT e o aviso de autoria que ela obriga a manter cita os dois. Sem `email` de
# propósito: endereço pessoal em metadado de pacote é dado que o projeto
# publica para sempre em troca de nada, e quem quiser falar com o projeto tem o
# endereço de issues logo abaixo (§2 do CONVENTIONS.md).
authors = [
  { name = "Caio Castro" },
  { name = "João Pedro Barreto do Prado Gunthen" },
]

# MIT, decidida em 15/09/2026 (A1 do ROADMAP, que estava adiado desde 14/09).
# A escolha é sobre o que se exige de quem pega o código, e aqui a resposta é
# "nada além do crédito": este projeto não é biblioteca que outros embutem, é
# ferramenta que uma pessoa instala no próprio assistente. GPL cobraria atrito
# por uma garantia sem valor nesse uso, já que ninguém redistribui versão
# modificada de um cliente de bandejão, e a cláusula de patente da Apache
# protege contra um risco que este projeto não tem.
#
# `license-files` em vez do campo `license` de texto livre: desde a PEP 639 o
# caminho declarado é o arquivo, e o classificador de licença está deprecado.
#
# O que a licença NÃO faz: ela não diz nada sobre a relação com a USP. Isso é
# outro assunto, e quem o trata é o aviso de projeto não-oficial na descrição
# acima e no README.
license = "MIT"
license-files = ["LICENSE"]

# Piso medido, não estimado: 3.11 é a versão mais baixa em que a SUÍTE deste
# projeto roda, porque `tomllib` (que `tests/test_pacote.py` usa para ler este
# arquivo) só entra na stdlib no 3.11. O runtime em si provavelmente desce até o
# 3.10 — é onde `list[X] | None` passa a existir em tempo de execução, e o
# `anotar` do RUCard avalia isso de verdade —, mas 3.10 é número que ninguém
# rodou aqui. Anunciar piso não exercitado é a mesma classe de erro que o §1.1
# corrige: afirmar sobre ambiente sem ter medido.
requires-python = ">=3.11"

# RUNTIME, e só. `pytest` é dependência de DESENVOLVIMENTO e nunca entra nesta
# lista. O núcleo dos três sistemas — política, cliente, projeção/dwr, ferramenta —
# é stdlib pura, e é justamente por isso que o import do SDK mora dentro de
# `main()` em vez do topo do módulo (ver o cabeçalho de `requirements.txt`).
# Um `pytest` aqui instalaria a suíte de testes deste repo na máquina de quem só
# quer o bandejão, e declararia como produto uma coisa que o produto não importa.
# P2 trava isto pelos dois lados: reprova se `pytest` aparecer, e reprova se esta
# lista divergir do `requirements.txt`, que segue sendo citado pelo nome na
# mensagem de SDK ausente dos três servidores (e tem teste sobre essa mensagem).
dependencies = ["mcp>=2,<3"]

# Sem isto, `pip show usp-mcp` devolve nome, versão e descrição, e nenhum
# caminho de volta para o repositório. Quem instalou por `pipx`/`uvx` não tem
# checkout nenhum para consultar: o pacote é o único artefato na mão dessa
# pessoa, e é ele que tem de dizer onde o código mora e onde se relata um
# defeito. É o mesmo desenho do Invariante 6 aplicado a metadado: resposta que
# não leva a lugar nenhum é resposta que manda o leitor adivinhar.
#
# Os rótulos estão em inglês, como todas as chaves do TOML à volta: quem lê
# `Homepage` e `Issues` aqui não é uma pessoa, é o PyPI e o `pip`, que os
# reconhecem por esse nome. O `tests/test_urls_do_repo.py` (U1) passou a varrer
# este arquivo junto com o README e o CLAUDE.md, para o dono do repositório não
# poder divergir em silêncio. Foi o estrago medido em 14/09/2026.
[project.urls]
Homepage = "https://github.com/CaioCastro1/usp-mcp"
Issues = "https://github.com/CaioCastro1/usp-mcp/issues"

[project.optional-dependencies]
# Espelha `requirements-dev.txt`. `pip install -e ".[dev]"` num checkout faz o que
# os dois `-r` faziam, mais os três comandos abaixo em `.venv/bin/`. Os arquivos
# `requirements*.txt` continuam existindo, e não por nostalgia: os três `main()`
# mandam `pip install -r requirements.txt` quando o SDK falta, e há teste sobre
# essa frase exata (`tests/{jupiter,moodle}/test_server_stdio.py`).
# `pyyaml` é do C10, e só dele: sem um parser de verdade, o teste que guarda o
# workflow lê YAML como texto — que foi exatamente o buraco por onde passou um
# arquivo que o GitHub recusa a abrir, com a suíte inteira verde (§9, 17/09).
# Escrever um segundo parser aqui seria a mesma pergunta com duas
# implementações, que é o preço que este repositório já pagou três vezes.
dev = ["pytest>=8,<10", "pyyaml>=6,<7"]

# TRÊS entry points, um por servidor — e não UM só com argumento de sistema
# espelhando o `scripts/servidor.sh`. A alternativa foi considerada e perde por
# três motivos, nenhum deles estético:
#
# 1. Um entry point com argumento exige um despachante NOVO em Python, que
#    reimplementa o que o lançador já faz: descobrir os sistemas por `usp_mcp/*/server.py`,
#    recusar o nome errado ANTES de subir o interpretador e citar os válidos na
#    negativa (Invariante 6). Passariam a existir duas respostas para "quais
#    sistemas existem", em duas linguagens, com um teste só cobrindo uma. Este
#    repo já registrou três vezes o preço de a mesma pergunta ter duas
#    implementações — foi o defeito do `[ -f .env ]` no gate, no `token.sh` e no
#    `ws.sh` (§9, 12/09/2026).
# 2. Os três `main()` já existem e já são exercitados como PROCESSO REAL
#    (`tests/handshake/` e L1/L2). Apontar o console script direto para eles custa
#    zero linha de runtime nova. O despachante custaria um módulo novo exatamente
#    na casca stdio — que é o lugar onde este projeto já teve um `main()` quebrado
#    com a suíte inteira verde (§9, 31/08/2026).
# 3. O nome do comando fica IGUAL ao `serverInfo.name` que o servidor responde no
#    `initialize`: `usp-mcp-moodle` dos dois lados. Quem escreve a config do
#    cliente e quem lê o handshake leem a mesma palavra. P4 trava a fórmula deste
#    lado; L2 já travava a do outro.
#
# O preço de três é ter de lembrar do quarto no dia em que um quarto sistema
# nascer. Curado como este repo cura isso em todo lugar (H9, L2, o glob do
# lançador): P1 deriva o conjunto esperado de `usp_mcp/*/server.py` e reprova se
# esta tabela divergir dele. A lista à mão continua sendo lista à mão — o que
# muda é que ela não envelhece calada.
#
# O QUARTO comando, `usp-mcp-token`, NÃO é um servidor e não sai desse glob: é o
# obtentor da chave do e-Disciplinas, o `scripts/token.sh` portado para Python
# em 18/09/2026 (`usp_mcp/token/`). Ele existe aqui por um motivo só, e é o
# Windows: o pacote instalado põe um `usp-mcp-token.exe` em `.venv\Scripts\`, e
# com isso a pessoa obtém a chave do PowerShell que já abriu para instalar, sem
# precisar do Git Bash — que era o degrau em que a instalação parava. Em Mac e
# Linux o `./scripts/token.sh` continua valendo e chama este mesmo módulo. P1
# separa os dois grupos: os servidores continuam comparados com o disco, e as
# ferramentas são uma lista fechada que cresce só quando alguém escreve por quê.
[project.scripts]
usp-mcp-jupiter = "usp_mcp.jupiter.server:main"
usp-mcp-moodle = "usp_mcp.moodle.server:main"
usp-mcp-rucard = "usp_mcp.rucard.server:main"
usp-mcp-token = "usp_mcp.token.cli:main"

[tool.setuptools.packages.find]
# Só `usp_mcp*`. Sem isto o setuptools acha `tests`, `scripts`, `notas` e `docs` na
# raiz e ou reclama de layout ambíguo ou empacota a suíte de testes junto com o
# produto — o mesmo erro do `pytest` em `dependencies`, por outra porta.
include = ["usp_mcp*"]
namespaces = false
